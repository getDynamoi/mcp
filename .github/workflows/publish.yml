name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    name: Publish @dynamoi/mcp
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-and-mcp-registry-publish
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (npm auth)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: "@dynamoi"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_OS: linux
          BUN_INSTALL_CPU: x64

      - name: Build
        run: bun run build

      - name: Validate MCP Registry metadata
        run: bun run registry:validate

      - name: Verify npm auth
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish (Changesets)
        # `changeset publish` is a no-op unless package.json has a version
        # higher than what's already on npm.
        run: bun run changeset:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait for npm readback
        run: bun run registry:wait:npm

      - name: Check whether the MCP Registry is current
        id: registry
        shell: bash
        run: |
          presence="$(bun scripts/registry-contract.ts registry-presence)"
          case "$presence" in
            current) echo "current=true" >> "$GITHUB_OUTPUT" ;;
            absent) echo "current=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected registry presence result: $presence" >&2; exit 1 ;;
          esac

      - name: Install MCP Registry publisher
        if: steps.registry.outputs.current != 'true'
        shell: bash
        env:
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" mcp-publisher
          ./mcp-publisher --version

      - name: Authenticate to the MCP Registry
        if: steps.registry.outputs.current != 'true'
        run: ./mcp-publisher login github-oidc

      - name: Validate official registry manifest
        if: steps.registry.outputs.current != 'true'
        run: ./mcp-publisher validate

      - name: Publish to the MCP Registry
        if: steps.registry.outputs.current != 'true'
        run: ./mcp-publisher publish

      - name: Wait for official MCP Registry readback
        run: bun run registry:wait:official
